name: drift

# The Colab API is v1beta and colabtools moves. This job re-reads what package B pins — the discovery documents' methods,
# paths, schemas and proxy header, the colabtools facts the probe is built on, and the MCP protected-resource metadata —
# and fails when a fact the plugin relies on is gone, so a Google change is a red build rather than a quiet wrong answer
# (design §15.1, "Drift"). A new discovery revision is reported as a notice, not a failure: revisions move without a
# shape change, and this job is about shapes (review round 4, LOW 5). It never runs in `npm run check`.
on:
  schedule:
    # Mondays, 06:17 UTC.
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  google-shapes:
    name: google-shapes
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      # No npm ci: the check imports the package's own pinned facts (type stripping) and reads Google's documents.
      - name: Colab API discovery, colabtools and MCP metadata
        run: |
          node --input-type=module <<'NODE'
          import { COLAB_API_PATHS, COLAB_DISCOVERY_REVISION, CREDENTIAL_FILES, GCLOUD_CONFIG_DIR, PROXY_TOKEN_HEADER, RUNTIME_HOST_SUFFIXES } from "./src/runtime/discovery.ts"

          const problems = []
          const notes = []
          const note = (what, detail) => problems.push(`${what}: ${detail}`)
          const notice = (what, detail) => notes.push(`${what}: ${detail}`)

          const v1beta = await (await fetch("https://colaboratory.googleapis.com/$discovery/rest?version=v1beta")).json()
          const v1 = await (await fetch("https://colaboratory.googleapis.com/$discovery/rest?version=v1")).json()
          if (v1beta.revision !== COLAB_DISCOVERY_REVISION) notice("discovery revision", `live ${v1beta.revision}, pinned ${COLAB_DISCOVERY_REVISION}; review the diff when convenient`)

          const methods = {
            "runtimes.create": ["POST", COLAB_API_PATHS.runtimes],
            "runtimes.get": ["GET", "v1beta/{+name}"],
            "runtimes.delete": ["DELETE", "v1beta/{+name}"],
            "runtimes.list": ["GET", COLAB_API_PATHS.runtimes],
            "runtimespecs.list": ["GET", COLAB_API_PATHS.runtimeSpecs],
          }
          for (const [id, [httpMethod, path]] of Object.entries(methods)) {
            const [resource, name] = id.split(".")
            const method = discoveryMethod(v1beta, resource, name)
            if (!method) note(`method ${id}`, "is gone from the v1beta discovery document")
            else {
              if (method.httpMethod !== httpMethod) note(`method ${id}`, `HTTP method ${method.httpMethod}, expected ${httpMethod}`)
              if (method.path !== path) note(`method ${id}`, `path ${method.path}, expected ${path}`)
            }
          }
          if (!discoveryMethod(v1beta, "v1beta", "getSubscription")) note("method colaboratory.getSubscription", "is gone from the v1beta discovery document")
          // The create's operation is followed on v1 (design §9.5, review LOW 3).
          for (const name of ["get", "wait"]) {
            if (!discoveryMethod(v1, "operations", name)) note(`method colaboratory.operations.${name}`, "is gone from the v1 discovery document")
          }

          const required = {
            Runtime: ["connectionInfo", "name", "runtimeSpec", "version"],
            ConnectionInfo: ["expireTime", "token", "url"],
            Key: ["accelerator", "shape", "variant"],
            Operation: ["done", "error", "name", "response"],
            RuntimeSpec: ["eligible", "key"],
            Subscription: ["tier"],
            ErrorInfo: ["reason"],
          }
          for (const [schema, fields] of Object.entries(required)) {
            const properties = v1beta.schemas?.[schema]?.properties
            if (!properties) {
              note(`schema ${schema}`, "is gone from the v1beta discovery document")
              continue
            }
            for (const field of fields) if (!(field in properties)) note(`schema ${schema}`, `field ${field} is gone`)
          }
          const tokenDescription = v1beta.schemas?.ConnectionInfo?.properties?.token?.description ?? ""
          if (!tokenDescription.includes(PROXY_TOKEN_HEADER)) note("proxy token header", `${PROXY_TOKEN_HEADER} is no longer named by ConnectionInfo.token`)
          const createRequest = v1beta.resources?.runtimes?.methods?.create?.parameters ?? {}
          for (const query of ["requestId", "runtimeId"]) if (!(query in createRequest)) note("runtimes.create", `query parameter ${query} is gone`)

          // The colabtools facts the probe is built on (design §7.4 step 3; review H1 removed the environment markers).
          const raw = async (path) => (await fetch(`https://raw.githubusercontent.com/googlecolab/colabtools/HEAD/google/colab/${path}`)).text()
          const [auth, drive] = await Promise.all([raw("auth.py"), raw("drive.py")])
          for (const path of ["content/.adc/", "content/.config/credentials.db"]) {
            if (!CREDENTIAL_FILES.some((entry) => entry.includes(path.replace(/\/$/, "")))) note(`pinned credential file ${path}`, "is not in src/runtime/discovery.ts CREDENTIAL_FILES")
            if (!auth.includes(path)) note(`colabtools credential file ${path}`, "is no longer written by google/colab/auth.py")
          }
          if (!auth.includes("gce")) note("colabtools ephemeral auth", "no longer touches the gcloud config's gce file; the probe's one ephemeral trace moved")
          if (!drive.includes("fuse.drive")) note("colabtools Drive mount", "fuse.drive is no longer the mount type google/colab/drive.py checks")
          if (!GCLOUD_CONFIG_DIR.includes("config")) note("gcloud config directory", "is not the one the probe baselines")

          // Both remote servers publish their protected-resource metadata without a token; the scopes they name are the
          // ones design §4 and §10 declare.
          for (const [url, scope] of [
            ["https://colaboratory.googleapis.com/.well-known/oauth-protected-resource/mcp", "colaboratory"],
            ["https://aiplatform.googleapis.com/.well-known/oauth-protected-resource/mcp/notebook", "aiplatform"],
          ]) {
            const answer = await fetch(url)
            if (!answer.ok) note(`MCP metadata ${url}`, `answered ${answer.status}`)
            else if (!(await answer.text()).includes(scope)) note(`MCP metadata ${url}`, `no longer names the ${scope} scope`)
          }

          // The runtime proxy host is narrowed to Google-owned suffixes, and L2 pins the exact one before release (LOW 4).
          for (const suffix of ["colab.dev", "googleusercontent.com"]) {
            if (!RUNTIME_HOST_SUFFIXES.includes(suffix)) note("runtime host allow-list", `no longer names ${suffix}`)
          }
          if (RUNTIME_HOST_SUFFIXES.includes("google.com")) note("runtime host allow-list", "is broader than the runtime proxy needs (review LOW 4)")

          for (const text of notes) console.log(`drift notice: ${text}`)
          if (problems.length > 0) {
            console.error("Google's shapes moved; update package B and the pin in src/runtime/discovery.ts:")
            for (const problem of problems) console.error(`  - ${problem}`)
            process.exit(1)
          }
          console.log("drift: the pinned Colab API methods, schemas, colabtools facts and MCP scopes are unchanged")

          function discoveryMethod(document, resource, name) {
            if (resource === "v1beta" || resource === "operations") return document.resources?.[resource]?.methods?.[name] ?? document.methods?.[name]
            return document.resources?.[resource]?.methods?.[name]
          }
          NODE
