name: Release

# A tag v<package.json version> on a master commit whose CI passed makes the GitHub Release. The plugin is not
# published to npm: a consumer pins the tag and dist/ is attached to the Release.
#
# Least privilege: `build` runs the repository's code and holds no write token; `publish` runs no repository code,
# verifies the files against SHA256SUMS and creates the Release with contents: write.

on:
  push:
    tags:
      - "v*"

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build the Release files
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false
          token: ""
      - run: npm ci --ignore-scripts
      - run: npm run check
      - name: The Release files
        env:
          TAG: ${{ github.ref_name }}
        run: node scripts/release.mjs "$TAG"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release
          path: release/
          if-no-files-found: error

  publish:
    name: Publish the GitHub Release
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: release
      - name: Check the files against SHA256SUMS
        working-directory: release
        run: sha256sum -c SHA256SUMS
      - name: Create the Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          prerelease=""
          case "$TAG" in *-*) prerelease="--prerelease" ;; esac
          gh release create "$TAG" release/* --repo "$REPO" --verify-tag --title "$TAG" --generate-notes $prerelease
